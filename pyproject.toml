[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amdi-validation"
version = "0.4.0"
description = "Reproducible numerical validation suite for adaptive multiresolution diffusion operators"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-image>=0.21",
]

[tool.setuptools]
packages = ["amdi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
